<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Akhil Paladugu, Search, Growth & AI Marketing</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" href="assets/favicon.svg"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;background:var(--paper-cream);}
  #root{min-height:100vh;display:flex;flex-direction:column;}
  main{flex:1;}
  *{box-sizing:border-box;}
  button{font-family:var(--font-sans);}
  html{scroll-behavior:smooth;}
  section{scroll-margin-top:88px;}

  /* Link + nav hover */
  nav a[href^="#"]:hover{color:var(--signal-indigo)!important;}

  /* Tool tile hover lift + glow */
  .tool-tile{cursor:default;}
  .tool-tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px -10px rgba(67,56,232,0.28)!important;border-color:rgba(67,56,232,0.35)!important;}

  /* Generic card hover (project, expertise, gpt, experience) */
  .lift{transition:transform 260ms cubic-bezier(0.2,0.8,0.2,1), box-shadow 260ms, border-color 260ms;}
  .lift:hover{transform:translateY(-4px);box-shadow:0 18px 40px -16px rgba(20,21,40,0.22);border-color:rgba(67,56,232,0.3)!important;}

  /* CTA button hover */
  .btn-primary{transition:transform 160ms var(--ease-standard), box-shadow 160ms, background 160ms;}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 22px -8px rgba(67,56,232,0.5);}
  .btn-secondary{transition:transform 160ms var(--ease-standard), border-color 160ms, background 160ms;}
  .btn-secondary:hover{transform:translateY(-2px);border-color:var(--signal-indigo);background:rgba(67,56,232,0.04);}
  .link-arrow{transition:gap 180ms var(--ease-standard);}
  .link-arrow:hover{gap:12px;}

  /* Contact card hover */
  .contact-card{transition:background 180ms;}
  .contact-card:hover{background:rgba(246,241,232,0.06);}

  /* Expertise card tint hover (inside overflow-hidden grid) */
  .exp-card{transition:background 200ms;}
  .exp-card:hover{background:#FBF8F2;}

  /* Entrance: reveal on scroll */
  @media (prefers-reduced-motion: no-preference){
    .reveal{opacity:0;transform:translateY(24px);transition:opacity 640ms var(--ease-out-soft), transform 640ms var(--ease-out-soft);}
    .reveal.in{opacity:1;transform:none;}
  }

  /* ============ RESPONSIVE: TABLET ≤ 900px ============ */
  @media (max-width: 900px){
    .nav-wrap{padding:16px 28px!important;}
    .nav-role{display:none!important;}
    .nav-items{gap:16px!important;}
    .nav-links{gap:14px!important;}
    .nav-links a{font-size:13px!important;}
    section, .hero-wrap{padding-left:28px!important;padding-right:28px!important;}
    .hero-wrap{padding-top:56px!important;padding-bottom:40px!important;grid-template-columns:1fr!important;gap:40px!important;}
    .hero-right{order:-1!important;align-items:center!important;}
    .hero-right .portraitWrap, .hero-right > div:first-child{width:min(100%,340px)!important;margin:0 auto!important;}
    .about-grid{grid-template-columns:1fr!important;gap:40px!important;}
    .exp-cards-grid{grid-template-columns:repeat(2,1fr)!important;}
    .exp-cards-grid > div{border-right:none!important;border-bottom:1px solid rgba(20,21,40,0.08)!important;}
    .ach-grid{grid-template-columns:repeat(2,1fr)!important;}
    .proof-grid{grid-template-columns:1fr!important;}
    .proof-details{grid-template-columns:1fr 1fr!important;}
    .brands-grid{grid-template-columns:1fr!important;}
    .brands-summary{grid-template-columns:1fr 1fr!important;row-gap:20px!important;}
    .brands-summary > div[style*="width:1px"]{display:none!important;}
    .proj-grid{grid-template-columns:1fr!important;}
    .wh-grid{grid-template-columns:repeat(2,1fr)!important;}
    .contact-cardrow{grid-template-columns:repeat(2,1fr)!important;}
    .mq-inner{grid-template-columns:1fr!important;gap:16px!important;}
    .mq-row{grid-template-columns:repeat(4,1fr)!important;}
    .hero-metarow{grid-template-columns:1fr 1fr!important;row-gap:16px!important;}
    .hero-metarow > div[style*="width:1px"]{display:none!important;}
  }

  /* ============ RESPONSIVE: MOBILE ≤ 640px ============ */
  @media (max-width: 640px){
    html{font-size:15px;}
    .nav-wrap{padding:12px 18px!important;}
    .nav-wrap .word{font-size:19px!important;}
    .nav-items{gap:10px!important;}
    .nav-links{display:none!important;}
    .nav-cta{padding:8px 13px!important;font-size:12.5px!important;}
    section, .hero-wrap{padding-left:18px!important;padding-right:18px!important;}
    .hero-wrap{padding-top:36px!important;padding-bottom:32px!important;gap:28px!important;}
    .hero-left{gap:20px!important;}
    .hero-metarow{grid-template-columns:1fr!important;gap:16px!important;}
    .hero-metarow > div[style*="width:1px"]{display:none!important;}
    .hero-metarow > div:not([style*="width:1px"]){padding:8px 0!important;border-bottom:1px dashed rgba(20,21,40,0.1)!important;}
    .about-grid{gap:28px!important;}
    .exp-cards-grid{grid-template-columns:1fr!important;}
    .exp-cards-grid > div{border-right:none!important;min-height:0!important;}
    .timeline-row{grid-template-columns:1fr!important;gap:8px!important;}
    .timeline-year{padding-top:0!important;justify-content:flex-start!important;gap:8px!important;}
    .timeline-line, .timeline-linefill{display:none!important;}
    .timeline-card{margin-left:0!important;}
    .timeline-progresslab{margin-left:0!important;max-width:none!important;}
    .ach-grid{grid-template-columns:1fr 1fr!important;}
    .ach-grid > div{padding:20px 18px!important;min-height:130px!important;}
    .proof-surfaces{gap:5px!important;}
    .proof-details{grid-template-columns:1fr!important;}
    .proof-details > div{border-right:none!important;border-bottom:1px solid rgba(20,21,40,0.08)!important;}
    .brands-summary{grid-template-columns:1fr!important;row-gap:18px!important;padding:22px 20px!important;}
    .proj-card{grid-template-columns:1fr!important;}
    .proj-cardright{border-left:none!important;padding-left:0!important;border-top:1px solid rgba(20,21,40,0.08)!important;padding-top:16px!important;margin-top:4px!important;}
    .tools-row{grid-template-columns:1fr!important;gap:12px!important;padding:20px 20px!important;}
    .wh-grid{grid-template-columns:1fr!important;}
    .contact-cardrow{grid-template-columns:1fr!important;}
    .contact-cardrow a{border-right:none!important;border-bottom:1px solid rgba(246,241,232,0.12)!important;}
    .contact-footer{flex-direction:column!important;align-items:flex-start!important;gap:14px!important;}
    .mq-inner{padding:20px 18px!important;}
    .mq-row{grid-template-columns:repeat(3,1fr)!important;}
    .mq-cell{padding:10px 6px!important;}
    .mq-cell .brandName, .mq-cell span{font-size:16px!important;}
    h1{font-size:clamp(36px,11vw,64px)!important;}
    .lift:hover, .exp-card:hover{transform:none!important;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="src/Nav.jsx"></script>
<script type="text/babel" src="src/Hero.jsx"></script>
<script type="text/babel" src="src/Marquee.jsx"></script>
<script type="text/babel" src="src/About.jsx"></script>
<script type="text/babel" src="src/Expertise.jsx"></script>
<script type="text/babel" src="src/Experience.jsx"></script>
<script type="text/babel" src="src/Achievements.jsx"></script>
<script type="text/babel" src="src/Proof.jsx"></script>
<script type="text/babel" src="src/Brands.jsx"></script>
<script type="text/babel" src="src/Projects.jsx"></script>
<script type="text/babel" src="src/Tools.jsx"></script>
<script type="text/babel" src="src/WhyHire.jsx"></script>
<script type="text/babel" src="src/Contact.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <>
      <Nav/>
      <main>
        <Hero/>
        <Marquee/>
        <About/>
        <Expertise/>
        <Experience/>
        <Achievements/>
        <Proof/>
        <Brands/>
        <Projects/>
        <Tools/>
        <WhyHire/>
        <Contact/>
      </main>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

// Scroll-reveal: tag major blocks, reveal as they enter
setTimeout(() => {
  const sel = 'section > div > h2, section h2, .reveal-on';
  const targets = new Set();
  document.querySelectorAll('#about, #experience, #proof, #brands, #projects, #tools, #contact, main section').forEach(s => {
    // reveal direct child wrappers of each section
    Array.from(s.children).forEach(c => targets.add(c));
  });
  const els = Array.from(targets);
  els.forEach(el => el.classList.add('reveal'));
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -8% 0px'});
  els.forEach(el => io.observe(el));
  // Failsafe: reveal everything after 3s in case observer misses
  setTimeout(() => els.forEach(el => el.classList.add('in')), 3000);
}, 400);
</script>
</body>
</html>
